# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "3"
# The Enterprise Edition is a workspace of its own (in the excluded directory): CE builds never compile it.
exclude = ["ee"]
members = ["crates/*", "services/auth", "services/channels", "services/fanout", "services/messages", "services/outbox", "services/persister", "services/presence", "services/push", "services/reaction-batcher", "services/search-indexer", "services/readstate", "services/users", "tools/chaos", "tools/e2e-smoke", "tools/loadgen", "tools/xmsgctl"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"
version = "0.0.0"
publish = false
