syntax = "proto3";

package xmsg.v1;

option java_multiple_files = true;
option java_package = "dev.xmsg.proto.v1";

// Events of the users service (topic `users.events`, from its outbox; plan §6.5).
// Absolute and idempotent: consumers may see each one more than once.
message UsersEvent {
  oneof event {
    WorkspaceMemberRemoved member_removed = 1;
    WorkspaceMemberRemovalCompleted removal_completed = 2;
  }
}

// A user left or was removed from a workspace. From now on nothing of the
// workspace reaches them: fan-out drops their deliveries for it, and a job makes
// them leave each of the workspace's channels.
message WorkspaceMemberRemoved {
  int64 workspace_id = 1;
  int64 user_id = 2;
  // The remover (the user themselves when leaving).
  int64 removed_by = 3;
  int64 removed_at_ms = 4;
}

// The job has taken the user out of every channel of the workspace; fan-out's
// deny-list entry can go.
message WorkspaceMemberRemovalCompleted {
  int64 workspace_id = 1;
  int64 user_id = 2;
  // How many channel memberships were ended.
  int32 channels = 3;
  int64 completed_at_ms = 4;
}
