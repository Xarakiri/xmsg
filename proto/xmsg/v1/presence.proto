syntax = "proto3";

package xmsg.v1;

import "xmsg/v1/enums.proto";

option java_multiple_files = true;
option java_package = "dev.xmsg.proto.v1";

// One connection's state, from its gateway to the presence service (NATS
// `xmsg.svc.presence.ping`, queue group): on connect, on activity changes, every 30 s, and
// when it closes. A connection not heard from within its TTL counts as gone.
message PresencePing {
  int64 user_id = 1;
  string conn_id = 2;
  ConnectionState state = 3;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  // The user is using the app on this connection.
  CONNECTION_STATE_ACTIVE = 1;
  // Connected, but idle or in the background.
  CONNECTION_STATE_IDLE = 2;
  // Closed.
  CONNECTION_STATE_GONE = 3;
}

// A user's status: published on `presence.{user_id}` when it changes, and sent to
// clients watching that user.
message PresenceUpdate {
  int64 user_id = 1;
  PresenceStatus status = 2;
}

// Request/reply on `xmsg.svc.presence.get`: current statuses (offline when unknown).
message PresenceQuery {
  repeated int64 user_ids = 1;
}

message PresenceReply {
  repeated PresenceUpdate updates = 1;
}
