syntax = "proto3";

package xmsg.v1;

import "xmsg/v1/enums.proto";

option java_multiple_files = true;
option java_package = "dev.xmsg.proto.v1";

// Input to the sequencer. Topic `messages.in`, Kafka key = channel_id
// (8-byte big-endian), partition = spec/partitioning.
message InboundEvent {
  int64 channel_id = 1;
  int64 workspace_id = 2;
  // The user performing the action.
  int64 actor_id = 3;
  // client_msg_id for messages, outbox event ID for outbox-originated events.
  // The sequencer drops repeats within 15 minutes of event time.
  string dedupe_id = 4;
  // Set on commands whose outcome is reported on `commands.results`.
  string request_id = 5;

  oneof payload {
    SendMessage send_message = 10;
    ChannelCreated channel_created = 11;
    MemberJoinRequested member_join_requested = 12;
    MemberKickRequested member_kick_requested = 13;
    ReactionBatch reaction_batch = 16;
    EditMessage edit_message = 14;
    DeleteMessage delete_message = 15;
    MemberRoleChangeRequested member_role_change_requested = 17;
    // From the calls service only (ADR-0025): what LiveKit reported about a call.
    CallEvent call_event = 18;
  }
}

// Only the author edits (checked by the messages service against the stored row).
message EditMessage {
  int64 msg_seq = 1;
  int64 message_id = 2;
  string body = 3;
}

// The author deletes their own message; anyone else's needs `as_admin`, which the
// sequencer checks against the actor's role.
message DeleteMessage {
  int64 msg_seq = 1;
  int64 message_id = 2;
  bool as_admin = 3;
}

// A second's worth of reaction operations on one (message, emoji), from the
// reaction-batcher (ADR-0015): at most one per user, the latest by counter.
message ReactionBatch {
  int64 message_id = 1;
  int64 msg_seq = 2;
  string emoji = 3;
  repeated ReactionOp ops = 4;
}

message ReactionOp {
  int64 user_id = 1;
  bool add = 2;
  int64 counter = 3;
}

// The message a thread reply belongs to: its msg_seq and message_id.
message ThreadRoot {
  int64 msg_seq = 1;
  int64 message_id = 2;
}

message SendMessage {
  string body = 1;
  // Set for a thread reply (ADR-0005).
  ThreadRoot thread_root = 2;
  // Files the sender uploaded to this channel (ADR-0024), from the client.
  repeated int64 file_ids = 3;
  // Those files' details, filled in by the messages service from its own records (never
  // taken from the client); the sequencer copies them into MessageCreated.
  repeated Attachment attachments = 4;
}

// A file in a message (ADR-0024): what a client needs to show it without asking the media
// service first. The bytes are at /v1/files/{file_id} for members of the channel.
message Attachment {
  int64 file_id = 1;
  string name = 2;
  // Sniffed for images; otherwise the uploader's claim (display only).
  string content_type = 3;
  int64 size = 4;
  // Images only.
  int32 width = 5;
  int32 height = 6;
  bool has_thumbnail = 7;
}

// How a message's attachments are stored (the `attachments` blob in Cassandra).
message Attachments {
  repeated Attachment items = 1;
}

message ChannelCreated {
  ChannelType type = 1;
  repeated int64 initial_member_ids = 2;
  // Set by the sequencer on output (ignored on input): the initial members
  // with their roles, so consumers never re-derive the rules.
  repeated MemberJoined members = 3;
  // Display name at creation (empty for DMs). Later renames are `channel.updated`.
  string name = 4;
}

// The actor adds `user_id` (an invite), or joins themselves when actor_id == user_id.
message MemberJoinRequested {
  int64 user_id = 1;
}

// The actor removes `user_id`, or leaves when actor_id == user_id.
message MemberKickRequested {
  int64 user_id = 1;
}

// A channel admin sets `user_id`'s role: member, poster (who may post in a broadcast
// channel) or admin. Nobody changes their own role (a channel never loses its last admin
// that way).
message MemberRoleChangeRequested {
  int64 user_id = 1;
  MemberRole role = 2;
}

// Output of the sequencer. Topic `messages.persisted`, same key and partition.
message SequencedEvent {
  int64 channel_id = 1;
  int64 workspace_id = 2;
  int64 actor_id = 3;
  // Increases on every channel event. 0 for rejections, which are not channel
  // events and are delivered only to the actor.
  int64 event_seq = 4;
  // Increases only on new top-level messages; 0 otherwise.
  int64 msg_seq = 5;
  // event_seq of the channel's latest membership change (ADR-0006).
  int64 membership_version = 6;
  FanoutMode fanout_mode = 7;
  string dedupe_id = 8;
  string request_id = 9;
  ChannelType channel_type = 16;

  oneof payload {
    MessageCreated message_created = 10;
    ChannelCreated channel_created = 11;
    MemberJoined member_joined = 12;
    MemberLeft member_left = 13;
    Rejected rejected = 14;
    ChannelModeChanged channel_mode_changed = 15;
    ReactionsChanged reactions_changed = 19;
    ThreadReply thread_reply = 20;
    MessageEdited message_edited = 17;
    MessageDeleted message_deleted = 18;
    MemberRoleChanged member_role_changed = 21;
    CallEvent call_event = 22;
  }
}

// Edits and deletes take an event_seq but no msg_seq (ADR-0005); they name their
// target by its msg_seq and message_id.
message MessageEdited {
  int64 msg_seq = 1;
  int64 message_id = 2;
  string body = 3;
  // Event time, set by the sequencer.
  int64 edited_at_ms = 4;
}

message MessageDeleted {
  int64 msg_seq = 1;
  int64 message_id = 2;
}

message MessageCreated {
  // Snowflake: (ms timestamp, partition, counter), assigned by the sequencer.
  int64 message_id = 1;
  string body = 2;
  // Parsed by the sequencer from `<@user_id>` tokens in the body: channel members only,
  // never the author, at most 50.
  repeated int64 mentioned_user_ids = 3;
  // `<!channel>` or `<!here>` from a channel admin (never in broadcast channels).
  bool mentions_channel = 4;
  // Files attached by the author (ADR-0024).
  repeated Attachment attachments = 5;
}

message MemberJoined {
  int64 user_id = 1;
  MemberRole role = 2;
}

message MemberRoleChanged {
  int64 user_id = 1;
  MemberRole role = 2;
}

message MemberLeft {
  int64 user_id = 1;
}

// A reply in a thread (ADR-0005): an event_seq and its own reply_seq, but no msg_seq, so
// it never counts as an unread channel message. `reply_count` is the root's absolute
// count after it. The actor is the author; dedupe_id is their client_msg_id.
message ThreadReply {
  int64 message_id = 1;
  string body = 2;
  int64 root_msg_seq = 3;
  int64 root_message_id = 4;
  int64 reply_seq = 5;
  int64 reply_count = 6;
  // As for MessageCreated: members only, never the author, at most 50.
  repeated int64 mentioned_user_ids = 7;
  // Files attached by the author (ADR-0024).
  repeated Attachment attachments = 8;
}

// A reaction batch applied by the sequencer: an event_seq, no msg_seq. `count` is the
// absolute number of users with this reaction now; `added` / `removed` are the users
// whose reaction actually changed (stale and repeated operations are left out).
message ReactionsChanged {
  int64 message_id = 1;
  int64 msg_seq = 2;
  string emoji = 3;
  int64 count = 4;
  repeated int64 added = 5;
  repeated int64 removed = 6;
}

// Emitted when the channel switches between push and pull fan-out (ADR-0008).
message ChannelModeChanged {
  FanoutMode mode = 1;
}

message Rejected {
  RejectReason reason = 1;
  string detail = 2;
}

// Topic `commands.results`, key = request_id.
message CommandResult {
  string request_id = 1;
  int64 channel_id = 2;
  bool accepted = 3;
  RejectReason reason = 4;
  // event_seq of the resulting event when accepted.
  int64 event_seq = 5;
}

// Reply of the messages service to a send request (NATS `xmsg.svc.messages.send`).
// accepted = durably written to `messages.in`; ordering and the final
// membership check happen later in the sequencer (ADR-0006).
message SendResult {
  bool accepted = 1;
  RejectReason reason = 2;
  string detail = 3;
  // With REJECT_REASON_RATE_LIMITED: when the client may send again.
  uint32 retry_after_ms = 4;
}

// A voice/video call in a channel (ADR-0025): a call in a DM or group DM (the others are
// rung), or a channel's huddle (drop-in, no ringing). The calls service reports it from
// LiveKit's webhooks; the sequencer orders it like any channel event (no msg_seq), so
// every member learns of it and sync replays it.
message CallEvent {
  // The LiveKit room: new for each DM call; one per channel for a huddle.
  string call_id = 1;
  CallChange change = 2;
  bool huddle = 3;
  // Who's in the call after this change (absolute, so a lost update heals).
  repeated int64 participant_ids = 4;
  int64 started_at_ms = 5;
  // Set when it ends.
  int64 duration_ms = 6;
}
