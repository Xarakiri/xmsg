# SPDX-License-Identifier: LicenseRef-xmsg-EE
[package]
name = "xmsg-scim-ee"
description = "SCIM 2.0 user provisioning for one workspace, on the users service's provisioning API"
edition.workspace = true
license = "LicenseRef-xmsg-EE"
license-file = "../../LICENSE"
rust-version.workspace = true
version.workspace = true
publish = false

[features]
test-keys = ["xmsg-ee-license/test-keys"]

[[bin]]
name = "xmsg-scim-ee"
path = "src/main.rs"

[dependencies]
xmsg-ee-license = { path = "../../crates/license" }
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
