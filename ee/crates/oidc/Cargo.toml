# SPDX-License-Identifier: LicenseRef-xmsg-EE
[package]
name = "xmsg-ee-oidc"
description = "OpenID Connect single sign-on for the auth service's identity-provider extension point"
edition.workspace = true
license = "LicenseRef-xmsg-EE"
license-file = "../../LICENSE"
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
xmsg-auth = { path = "../../../services/auth" }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["sync"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net"] }
