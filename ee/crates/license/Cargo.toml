# SPDX-License-Identifier: LicenseRef-xmsg-EE
[package]
name = "xmsg-ee-license"
description = "Enterprise Edition licence keys: offline-verified Ed25519 signatures, per-feature expiry rules (ADR-0022)"
edition.workspace = true
license = "LicenseRef-xmsg-EE"
license-file = "../../LICENSE"
rust-version.workspace = true
version.workspace = true
publish = false

[features]
# Trust an extra public key from XMSG_EE_LICENSE_TEST_KEY: tests and CI only, never in
# a release build.
test-keys = []

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
getrandom = "0.4.3"
