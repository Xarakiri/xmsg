# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-readstate"
description = "Read positions and unread counts (ADR-0012): one writer per user, fed through readstate.events"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-authn = { path = "../../crates/xmsg-authn" }
xmsg-proto = { path = "../../crates/xmsg-proto" }
axum = "0.8.9"
futures-util = "0.3.34"
rdkafka = { version = "0.39.0", features = ["tokio"] }
scylla = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
xmsg-auth = { path = "../auth" }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
