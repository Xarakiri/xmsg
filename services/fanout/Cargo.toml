# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-fanout"
description = "Fan-out: delivers sequenced events to the gateways of connected members"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-nats = "0.46.0"
futures-util = "0.3.34"
rdkafka = { version = "0.39.0", features = ["tokio"] }
scylla = "1.5.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xmsg-proto = { path = "../../crates/xmsg-proto" }
