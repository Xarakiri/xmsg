# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-push"
description = "Web Push notifications for new messages and mentions (plan §5.11)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-authn = { path = "../../crates/xmsg-authn" }
xmsg-proto = { path = "../../crates/xmsg-proto" }
axum = "0.8.9"
base64 = "0.22"
rdkafka = { version = "0.39.0", features = ["tokio"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scylla = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-push = { version = "0.11", default-features = false }
