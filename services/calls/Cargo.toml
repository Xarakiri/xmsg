# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-calls"
description = "Voice and video calls (ADR-0025): LiveKit access tokens, and LiveKit's webhooks turned into sequenced call events"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-authn = { path = "../../crates/xmsg-authn" }
xmsg-partition = { path = "../../crates/xmsg-partition" }
xmsg-proto = { path = "../../crates/xmsg-proto" }
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.9.5"
rdkafka = { version = "0.39.0", features = ["tokio"] }
scylla = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
xmsg-auth = { path = "../auth" }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
