# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-media"
description = "Files and images (ADR-0024): uploads into S3-compatible storage, member-only downloads, thumbnails"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-authn = { path = "../../crates/xmsg-authn" }
xmsg-proto = { path = "../../crates/xmsg-proto" }
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rand = "0.9.5"
rdkafka = { version = "0.39.0", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
scylla = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
xmsg-auth = { path = "../auth" }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
