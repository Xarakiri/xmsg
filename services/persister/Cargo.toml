# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-persister"
description = "Persister: writes sequenced events from messages.persisted to the wide-column store"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3.34"
rdkafka = { version = "0.39.0", features = ["tokio"] }
scylla = "1.5.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xmsg-proto = { path = "../../crates/xmsg-proto" }

