# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-presence"
description = "Online / away / offline from gateway pings, kept in Valkey (plan §5.9)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-proto = { path = "../../crates/xmsg-proto" }
async-nats = "0.46.0"
futures-util = "0.3.34"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "script"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
