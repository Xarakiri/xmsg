# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-users"
description = "Users service: profiles, workspaces, workspace roles and invites"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-authn = { path = "../../crates/xmsg-authn" }
xmsg-proto = { path = "../../crates/xmsg-proto" }
async-nats = "0.46.0"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
xmsg-auth = { path = "../auth" }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
