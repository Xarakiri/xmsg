# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-channels"
description = "Channels service: channel and DM creation (Postgres + outbox + fast path), membership commands"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-authn = { path = "../../crates/xmsg-authn" }
xmsg-partition = { path = "../../crates/xmsg-partition" }
xmsg-proto = { path = "../../crates/xmsg-proto" }
axum = "0.8.9"
getrandom = "0.4.3"
rdkafka = { version = "0.39.0", features = ["tokio"] }
scylla = "1.5.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
xmsg-auth = { path = "../auth" }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
