# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-reaction-batcher"
description = "Batches reactions.in into one reaction batch per (message, emoji) per second (ADR-0015)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-partition = { path = "../../crates/xmsg-partition" }
xmsg-proto = { path = "../../crates/xmsg-proto" }
futures-util = "0.3.34"
rdkafka = { version = "0.39.0", features = ["tokio"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
