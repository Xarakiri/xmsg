# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-search-indexer"
description = "Indexes messages.persisted into OpenSearch (plan §5.12)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-proto = { path = "../../crates/xmsg-proto" }
rdkafka = { version = "0.39.0", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
