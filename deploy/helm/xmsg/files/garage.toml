# Garage, the bundled S3 store for files (ADR-0024): one node, one copy. The RPC secret and
# admin token come from the environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN), so they
# live in .env with the other secrets. `xmsg-media garage-init` creates the layout, the
# access key and the bucket.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
