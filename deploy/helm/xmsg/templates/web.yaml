{{- $full := include "xmsg.fullname" . -}}
# The web client and the single entry point: nginx serves the app and forwards the API
# paths and the WebSocket to the services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-web
  labels: {{- include "xmsg.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: {{- include "xmsg.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "xmsg.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- /* nginx resolves upstreams at start: without push, its path goes to auth (404). */}}
            {{- $push := ternary "push:8086" "auth:8081" .Values.push.enabled }}
            {{- $media := ternary "media:8087" "auth:8081" .Values.media.enabled }}
            {{- range $name, $port := dict "AUTH" "auth:8081" "CHANNELS" "channels:8082" "MESSAGES" "messages:8083" "USERS" "users:8084" "READSTATE" "readstate:8085" "PUSH" $push "MEDIA" $media "GATEWAY" "gateway:4000" }}
            - { name: XMSG_{{ $name }}_UPSTREAM, value: "{{ $full }}-{{ $port }}" }
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-web
  labels: {{- include "xmsg.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports:
    - { name: http, port: 80, targetPort: http }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels: {{- include "xmsg.labels" . | nindent 4 }}
  {{- /* ingress-nginx allows 1 MB bodies by default: uploads (ADR-0024) need 26 MB. Yours win. */}}
  {{- $annotations := deepCopy (default dict .Values.ingress.annotations) }}
  {{- if and .Values.media.enabled (contains "nginx" (default "" .Values.ingress.className)) }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-body-size" (default "26m" (index $annotations "nginx.ingress.kubernetes.io/proxy-body-size")) }}
  {{- end }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.enterprise.enabled }}
          # The admin console and its API.
          - path: /admin
            pathType: Prefix
            backend: { service: { name: {{ $full }}-admin, port: { name: http } } }
          {{- end }}
          {{- if and .Values.enterprise.enabled .Values.enterprise.scim.enabled }}
          # SCIM straight to its service: identity providers call it, browsers don't.
          - path: /scim
            pathType: Prefix
            backend: { service: { name: {{ $full }}-scim, port: { name: http } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $full }}-web, port: { name: http } } }
{{- end }}
