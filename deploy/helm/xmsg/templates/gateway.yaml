{{- $full := include "xmsg.fullname" . -}}
{{- $nats := include "xmsg.natsUrl" . | trimPrefix "nats://" | splitList ":" -}}
{{- $natsPort := "4222" -}}{{- if gt (len $nats) 1 -}}{{- $natsPort = index $nats 1 -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-gateway
  labels: {{- include "xmsg.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  # A quarter of the pods at a time (plan §5.1): each drains for drainSeconds while new
  # ones come up, so a rollout of 20 pods takes about 4 drain windows, not 20.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 25%, maxSurge: 25% }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
  template:
    metadata:
      labels: {{- include "xmsg.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      # On SIGTERM the gateway closes its connections spread over drainSeconds (clients
      # reconnect to other pods and resync), then exits; the grace period covers that.
      terminationGracePeriodSeconds: {{ add .Values.gateway.drainSeconds 30 }}
      containers:
        - name: gateway
          image: {{ include "xmsg.image" (list . "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: XMSG_GATEWAY_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: XMSG_GATEWAY_PORT, value: "4000" }
            - { name: XMSG_NATS_HOST, value: {{ index $nats 0 | quote }} }
            - { name: XMSG_NATS_PORT, value: {{ $natsPort | quote }} }
            - { name: XMSG_KAFKA_BOOTSTRAP, value: {{ .Values.kafka.bootstrap | quote }} }
            - { name: XMSG_PARTITIONS, value: {{ .Values.partitions | quote }} }
            - { name: XMSG_AUTH_JWKS_URL, value: "http://{{ $full }}-auth:8081/.well-known/jwks.json" }
            # Admission control and per-connection limits (services/gateway).
            - { name: XMSG_PROXY_HOPS, value: {{ default (ternary "2" "1" .Values.ingress.enabled) .Values.proxyHops | quote }} }
            - { name: XMSG_ADMISSION_RATE, value: {{ .Values.gateway.admission.newSessionsPerSecond | quote }} }
            - { name: XMSG_MAX_CONNECTIONS, value: {{ .Values.gateway.admission.maxConnections | quote }} }
            - { name: XMSG_PREAUTH_PER_IP, value: {{ .Values.gateway.admission.unauthenticatedPerIp | quote }} }
            - { name: XMSG_FRAME_RATE, value: {{ .Values.gateway.admission.framesPerSecond | quote }} }
            - { name: XMSG_FRAME_BURST, value: {{ .Values.gateway.admission.frameBurst | quote }} }
            - { name: XMSG_DRAIN_SECONDS, value: {{ .Values.gateway.drainSeconds | quote }} }
          ports:
            - { name: ws, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /healthz, port: ws }
            periodSeconds: 5
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-gateway
  labels: {{- include "xmsg.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway }
  ports:
    - { name: ws, port: 4000, targetPort: ws }
