{{- $full := include "xmsg.fullname" . -}}
# Settings every service reads (each ignores what it doesn't use). Hooks too, so the
# init jobs, which run before the rest of the release, can read them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-env
  labels: {{- include "xmsg.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  XMSG_PARTITIONS: {{ .Values.partitions | quote }}
  XMSG_KAFKA_BOOTSTRAP: {{ required "kafka.bootstrap is required" .Values.kafka.bootstrap | quote }}
  XMSG_REPLICATION_FACTOR: {{ .Values.kafka.replicationFactor | quote }}
  XMSG_CQL_NODES: {{ required "cassandra.nodes is required" .Values.cassandra.nodes | quote }}
  XMSG_CQL_KEYSPACE: {{ .Values.cassandra.keyspace | quote }}
  XMSG_NATS_URL: {{ include "xmsg.natsUrl" . | quote }}
  XMSG_AUTH_JWKS_URL: "http://{{ $full }}-auth:8081/.well-known/jwks.json"
  XMSG_SEQUENCER_URL: "http://{{ $full }}-sequencer:8090"
  XMSG_OUTBOX_MODE: {{ .Values.outbox.mode | quote }}
  XMSG_PUSH_SUBJECT: {{ .Values.push.subject | quote }}
  # Proxies in front of the services, for client addresses: the ingress (if any) and the web pod's nginx.
  XMSG_PROXY_HOPS: {{ default (ternary "2" "1" .Values.ingress.enabled) .Values.proxyHops | quote }}
  {{- with .Values.rateLimits }}
  {{- with .sends }}
  XMSG_RATE_SENDS: {{ . | quote }}
  {{- end }}
  {{- with .loginPerAccount }}
  XMSG_RATE_LOGIN_PER_ACCOUNT: {{ . | quote }}
  {{- end }}
  {{- with .loginPerIp }}
  XMSG_RATE_LOGIN_PER_IP: {{ . | quote }}
  {{- end }}
  {{- with .signupPerIp }}
  XMSG_RATE_SIGNUP_PER_IP: {{ . | quote }}
  {{- end }}
  {{- with .recoveryPerAccount }}
  XMSG_RATE_RECOVERY_PER_ACCOUNT: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with (include "xmsg.valkeyUrl" .) }}
  XMSG_VALKEY_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.opensearch.url }}
  XMSG_SEARCH_URL: {{ . | quote }}
  XMSG_OPENSEARCH_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.media.enabled }}
  XMSG_MEDIA_S3_ENDPOINT: {{ default (printf "http://%s-garage:3900" $full) .Values.media.s3.endpoint | quote }}
  XMSG_MEDIA_S3_REGION: {{ default (ternary "garage" "us-east-1" (empty .Values.media.s3.endpoint)) .Values.media.s3.region | quote }}
  XMSG_MEDIA_BUCKET: {{ .Values.media.s3.bucket | quote }}
  XMSG_MEDIA_MAX_BYTES: {{ .Values.media.maxBytes | quote }}
  XMSG_MEDIA_CONCURRENT_UPLOADS: {{ .Values.media.concurrentUploads | quote }}
  XMSG_MEDIA_WORKSPACE_QUOTA_BYTES: {{ .Values.media.workspaceQuotaBytes | int64 | quote }}
  {{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xmsg.secretName" . }}
  labels: {{- include "xmsg.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  XMSG_DATABASE_URL: {{ required "postgres.url is required (or secrets.existingSecret)" .Values.postgres.url | quote }}
  XMSG_AUTH_KEY: {{ required "secrets.authKey is required (or secrets.existingSecret)" .Values.secrets.authKey | quote }}
  {{- if and .Values.enterprise.enabled .Values.enterprise.scim.enabled }}
  XMSG_PROVISIONING_TOKEN: {{ required "enterprise.scim.provisioningToken is required with SCIM (or secrets.existingSecret)" .Values.enterprise.scim.provisioningToken | quote }}
  {{- end }}
  {{- if .Values.push.enabled }}
  XMSG_PUSH_VAPID_PRIVATE_KEY: {{ required "secrets.vapidPrivateKey is required when push is enabled" .Values.secrets.vapidPrivateKey | quote }}
  {{- end }}
  {{- if .Values.media.enabled }}
  XMSG_MEDIA_S3_KEY_ID: {{ required "media.s3.keyId is required with media (or secrets.existingSecret)" .Values.media.s3.keyId | quote }}
  XMSG_MEDIA_S3_SECRET: {{ required "media.s3.secret is required with media (or secrets.existingSecret)" .Values.media.s3.secret | quote }}
  {{- end }}
  {{- if include "xmsg.garageBundled" . }}
  {{- if not (regexMatch "^[0-9a-f]{64}$" .Values.garage.rpcSecret) }}
  {{- fail "garage.rpcSecret must be 64 hex digits (openssl rand -hex 32)" }}
  {{- end }}
  {{- if not (regexMatch "^GK[0-9a-f]{24}$" .Values.media.s3.keyId) }}
  {{- fail "with the bundled Garage, media.s3.keyId must be GK and 24 hex digits (GK$(openssl rand -hex 12))" }}
  {{- end }}
  XMSG_GARAGE_RPC_SECRET: {{ .Values.garage.rpcSecret | quote }}
  XMSG_GARAGE_ADMIN_TOKEN: {{ required "garage.adminToken is required with the bundled Garage" .Values.garage.adminToken | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.enterprise.enabled (not .Values.enterprise.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xmsg.enterpriseSecretName" . }}
  labels: {{- include "xmsg.labels" . | nindent 4 }}
type: Opaque
stringData:
  XMSG_EE_LICENSE: {{ required "enterprise.license is required (or enterprise.existingSecret)" .Values.enterprise.license | quote }}
  {{- range $k, $v := .Values.enterprise.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
