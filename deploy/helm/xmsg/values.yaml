# SPDX-License-Identifier: AGPL-3.0-only
# xmsg, Medium tier (plan §12.1): 3+ nodes, the customer's own backends.

image:
  # Images are <registry>/<name>:<tag> for services, sequencer, gateway and web.
  registry: ghcr.io/xarakiri/xmsg
  tag: ""                       # default: the chart's appVersion
  pullPolicy: IfNotPresent

# Fixed per installation (ADR-0021): Medium uses 64. Never change it in place.
partitions: 64

kafka:
  bootstrap: ""                 # required, e.g. kafka-0.kafka:9092,kafka-1.kafka:9092
  replicationFactor: 3

cassandra:
  nodes: ""                     # required, e.g. cassandra-0.cassandra:9042,cassandra-1.cassandra:9042
  keyspace: xmsg
  datacenter: dc1
  replicationFactor: 3

postgres:
  # A libpq URL (postgres://user:password@host:5432/xmsg). Stored in the chart's Secret,
  # or read from secrets.existingSecret (key XMSG_DATABASE_URL).
  url: ""

opensearch:
  url: ""                       # empty: search is off (Small and Medium may run without it)

# Bundled for convenience (one pod each); point url at your own to use that instead.
nats:
  bundled: true
  url: ""                       # when not bundled, e.g. nats://nats:4222
valkey:
  bundled: true
  url: ""                       # when not bundled, e.g. redis://valkey:6379

secrets:
  # An existing Secret with XMSG_DATABASE_URL, XMSG_AUTH_KEY, XMSG_PUSH_VAPID_PRIVATE_KEY
  # (and XMSG_PROVISIONING_TOKEN with SCIM; XMSG_MEDIA_S3_KEY_ID and XMSG_MEDIA_S3_SECRET with
  # media; XMSG_GARAGE_RPC_SECRET and XMSG_GARAGE_ADMIN_TOKEN with the bundled Garage).
  # When empty, the chart creates one from the values below.
  existingSecret: ""
  authKey: ""                   # 32 random bytes, base64 (openssl rand -base64 32)
  vapidPrivateKey: ""           # P-256 private key, raw 32 bytes, base64url (see services/push)

outbox:
  mode: relay                   # relay (the Rust poller) or cleanup (when Debezium relays)

push:
  enabled: true
  subject: "mailto:admin@example.com"

# Files and images (ADR-0024): the media service, and the S3-compatible store behind it.
media:
  enabled: true
  maxBytes: 26214400            # largest upload (25 MB); the web pods' nginx allows 26 MB
  concurrentUploads: 4          # per pod, held in memory while checked and stored
  # Storage per workspace unless the operator sets another through the users service's
  # provisioning API (PUT /internal/v1/workspaces/{id}/storage-quota); 0 = unlimited.
  workspaceQuotaBytes: 10737418240
  s3:
    # Your own S3-compatible store (Ceph RGW, Amazon S3, GCS in S3 mode, SeaweedFS…), with
    # the bucket and an access key already created. Empty: the bundled Garage below.
    endpoint: ""                # e.g. https://s3.eu-west-1.amazonaws.com
    region: ""                  # default: "garage" with the bundled store, else us-east-1
    bucket: xmsg-files
    # In the chart's Secret (or secrets.existingSecret: XMSG_MEDIA_S3_KEY_ID and
    # XMSG_MEDIA_S3_SECRET). For the bundled Garage: "GK" + 24 hex digits, and 64 hex
    # digits (openssl rand -hex 12 / -hex 32); the chart's setup job imports them.
    keyId: ""
    secret: ""

# Garage (AGPL-3.0), bundled when media.s3.endpoint is empty: one pod, one copy of each
# file on a PVC. For redundancy, run your own store (or a Garage cluster) and set the endpoint.
garage:
  image: dxflrs/garage:v2.5.0
  storage: 50Gi
  storageClassName: ""
  # In the chart's Secret (or secrets.existingSecret: XMSG_GARAGE_RPC_SECRET and
  # XMSG_GARAGE_ADMIN_TOKEN): openssl rand -hex 32 for each.
  rpcSecret: ""
  adminToken: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# Replicas and resources per Rust service (defaults below apply to all).
services:
  defaults:
    replicas: 2
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
  # Single active instances by design: the outbox relay holds a Postgres advisory lock
  # (standbys wait), the others are Kafka consumer groups (extra instances share load).
  overrides:
    outbox-relay: { replicas: 2 }
    # Up to 4 uploads of 25 MB in memory at once, plus thumbnails.
    media: { resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } } }

sequencer:
  replicas: 3
  standbyReplicas: 1
  storage: 10Gi
  storageClassName: ""
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }

gateway:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { memory: 1Gi }
  # On shutdown, connections are closed spread over this many seconds (plan §5.1: ~5 min).
  drainSeconds: 300
  # Admission control (plan §5.1): what one gateway pod takes on. Refused upgrades get 503
  # with a jittered Retry-After, so a reconnect storm spreads out.
  admission:
    newSessionsPerSecond: 2000  # 0 = unlimited
    maxConnections: 0           # per pod; 0 = unlimited
    unauthenticatedPerIp: 100   # sockets that haven't sent a valid Connect yet
    framesPerSecond: 30         # per connection; far beyond it the socket is closed
    frameBurst: 100

web:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

ingress:
  enabled: false
  className: ""
  host: chat.example.com
  annotations: {}
  tls: []                       # [{ secretName: chat-tls, hosts: [chat.example.com] }]

# Proxies between clients and the services, for per-address rate limits: empty means
# 2 with the chart's ingress (ingress + the web pod's nginx), 1 without. Add one for each
# load balancer or CDN that appends to X-Forwarded-For.
proxyHops: ""

# Rate limits (counted in Valkey), as "count/window" like 20/10s; empty keeps the default.
rateLimits:
  sends: ""                     # per person (default 20/10s)
  loginPerAccount: ""           # default 10/5m
  loginPerIp: ""                # default 50/5m
  signupPerIp: ""               # default 10/1h
  recoveryPerAccount: ""        # default 5/15m

# The Enterprise Edition (ADR-0022): auth runs xmsg-auth-ee (single sign-on, LDAP, enforced
# SSO) from the enterprise image, and SCIM provisioning can run too. Needs a licence; without
# a valid one auth behaves like the Community Edition.
enterprise:
  enabled: false
  image: enterprise             # <image.registry>/<this>:<image.tag>
  # An existing Secret with XMSG_EE_LICENSE and any secret settings (e.g.
  # XMSG_EE_OIDC_CLIENT_SECRET, XMSG_EE_LDAP_BIND_PASSWORD, XMSG_EE_SCIM_TOKEN). When
  # empty, the chart creates one from `license` and `secretEnv`.
  existingSecret: ""
  license: ""
  secretEnv: {}                 # { XMSG_EE_OIDC_CLIENT_SECRET: "…", XMSG_EE_LDAP_BIND_PASSWORD: "…" }
  auth:
    # Non-secret settings for xmsg-auth-ee (see the EE README), e.g.
    # { XMSG_EE_OIDC_ISSUER: https://acme.okta.com, XMSG_EE_OIDC_CLIENT_ID: xmsg }.
    # XMSG_AUTH_PUBLIC_URL and XMSG_WEB_URL default to https://<ingress.host>(/auth).
    env: {}
  scim:
    enabled: false
    workspaceId: ""             # the workspace the identity provider provisions
    # The users service's provisioning API token, shared with SCIM (any long random
    # string); the token for the identity provider goes in secretEnv as XMSG_EE_SCIM_TOKEN.
    provisioningToken: ""

# Topics, keyspace and Postgres schema, as pre-install hooks.
init:
  enabled: true
  kafkaImage: apache/kafka:3.9.1
  cassandraImage: cassandra:5.0
  postgresImage: postgres:17
