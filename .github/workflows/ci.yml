# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Licences, boundaries, vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers and core/ee boundary
        run: tools/check-spdx.sh
      - name: Partition vectors match the generator
        run: |
          python3 -I tools/gen-partition-vectors.py /tmp/vectors.csv
          diff -u spec/partitioning/vectors.csv /tmp/vectors.csv

  proto:
    name: Protobuf (Buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          # Breaking-change checks against main start once main has a baseline.
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main,subdir=proto
          push: false

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  typescript:
    name: TypeScript client core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: clients/core

  elixir:
    name: Elixir gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix format --check-formatted
        working-directory: services/gateway
      - run: mix test
        working-directory: services/gateway

  sequencer:
    name: Kotlin sequencer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
        working-directory: services/sequencer

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: docker compose -f deploy/compose/docker-compose.yml config -q
      - name: Start core stack and wait for init jobs
        working-directory: deploy/compose
        run: |
          docker compose up -d --wait kafka postgres valkey nats
          docker compose up kafka-init --exit-code-from kafka-init
      - name: Show logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
