# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Licences, boundaries, vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers and core/ee boundary
        run: tools/check-spdx.sh
      - name: Partition vectors match the generator
        run: |
          python3 -I tools/gen-partition-vectors.py /tmp/vectors.csv
          diff -u spec/partitioning/vectors.csv /tmp/vectors.csv

  proto:
    name: Protobuf (Buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          # Breaking-change checks against main start once main has a baseline.
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main,subdir=proto
          push: false
          # Results show in the job log and annotations; posting PR comments needs a write token.
          pr_comment: false

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (crates/xmsg-proto compiles proto/ with prost)
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  typescript:
    name: TypeScript clients (core + web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - run: npm ci
      - name: Generated protobuf modules are up to date
        run: |
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          ../tools/gen-ts-proto.sh
          git diff --exit-code -- core/src/gen
      - run: npm run typecheck --workspace @xmsg/client-core
      - run: npm test --workspace @xmsg/client-core
      - name: Web app typechecks and builds
        run: npm run build --workspace @xmsg/web

  elixir:
    name: Elixir gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Generated protobuf modules are up to date
        run: |
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          mix local.hex --force
          mix escript.install hex protobuf 0.17.1 --force
          tools/gen-elixir-proto.sh
          git diff --exit-code -- services/gateway/lib/xmsg_gateway/proto
      - run: mix deps.get
        working-directory: services/gateway
      - run: mix format --check-formatted
        working-directory: services/gateway
      - run: mix compile --warnings-as-errors
        working-directory: services/gateway
      - run: mix test
        working-directory: services/gateway

  sequencer:
    name: Kotlin sequencer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
        working-directory: services/sequencer

  sequencer-integration:
    name: Sequencer integration (real Kafka)
    runs-on: ubuntu-latest
    needs: sequencer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - uses: gradle/actions/setup-gradle@v4
      - name: Crash/fencing, restore and startup-check tests (Testcontainers)
        run: ./gradlew integrationTest -Dxmsg.crash.kills=12
        working-directory: services/sequencer
      - name: Upload sequencer logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequencer-integration-logs
          path: |
            services/sequencer/build/it-logs/
            services/sequencer/build/reports/tests/integrationTest/
          if-no-files-found: ignore

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: docker compose -f deploy/compose/docker-compose.yml config -q
      - name: Start core stack and wait for init jobs
        working-directory: deploy/compose
        run: |
          docker compose up -d --wait kafka cassandra postgres valkey nats
          docker compose up kafka-init --exit-code-from kafka-init
          docker compose up cassandra-init --exit-code-from cassandra-init
      - name: Check the Cassandra schema
        working-directory: deploy/compose
        run: |
          out=$(docker compose exec -T cassandra cqlsh -e "SELECT table_name FROM system_schema.tables WHERE keyspace_name = 'xmsg';")
          echo "$out"
          tables=$(echo "$out" | grep -oE '\(([0-9]+) rows\)' | grep -oE '[0-9]+')
          test "$tables" -eq "$(grep -c 'CREATE TABLE' init/cassandra/001_schema.cql)"
      - name: Show logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  helm:
    name: Helm chart (Medium tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.1
      - name: The chart's init files are the compose ones
        run: |
          diff deploy/compose/init/kafka/create-topics.sh deploy/helm/xmsg/files/create-topics.sh
          diff deploy/compose/init/cassandra/001_schema.cql deploy/helm/xmsg/files/001_schema.cql
          diff deploy/compose/init/postgres/001_schema.sql deploy/helm/xmsg/files/postgres-001_schema.sql
          diff deploy/compose/init/postgres/002_push.sql deploy/helm/xmsg/files/postgres-002_push.sql
      - name: Lint and render
        run: |
          helm lint deploy/helm/xmsg -f deploy/helm/xmsg/ci-values.yaml
          helm template ci deploy/helm/xmsg -f deploy/helm/xmsg/ci-values.yaml > rendered.yaml
          # Search and push off too.
          helm template ci deploy/helm/xmsg -f deploy/helm/xmsg/ci-values.yaml \
            --set opensearch.url= --set push.enabled=false > rendered-minimal.yaml
      - name: Validate against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml rendered-minimal.yaml

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [services, sequencer, gateway, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          push: false
          tags: xmsg/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  pipeline:
    name: Pipeline (service integration + end-to-end smoke, ${{ matrix.relay }} outbox relay)
    runs-on: ubuntu-latest
    needs: [rust, elixir, sequencer]
    # The same end-to-end checks with each outbox relay (ADR-0020): the Rust poller
    # (Small/Medium) and Debezium (Large). Integration tests run in the poller leg only.
    strategy:
      fail-fast: false
      matrix:
        relay: [poller, debezium]
    env:
      XMSG_PARTITIONS: "16"
      XMSG_KAFKA_BOOTSTRAP: localhost:9092
      XMSG_NATS_URL: nats://localhost:4222
      XMSG_CQL_NODES: localhost:9042
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - uses: gradle/actions/setup-gradle@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Start Kafka, NATS, Cassandra, PostgreSQL and Valkey (Small-tier compose)
        working-directory: deploy/compose
        run: |
          docker compose up -d --wait kafka nats cassandra postgres valkey
          docker compose --profile search up -d opensearch
          docker compose up kafka-init --exit-code-from kafka-init
          docker compose up cassandra-init --exit-code-from cassandra-init
      - name: Start Debezium and register the outbox connector
        if: matrix.relay == 'debezium'
        working-directory: deploy/compose
        env:
          XMSG_CONNECT_URL: http://localhost:8093
        run: |
          docker compose --profile debezium up -d --wait debezium
          init/debezium/register.sh
      - name: Build
        run: |
          cargo build --release -p xmsg-auth -p xmsg-users -p xmsg-channels -p xmsg-messages -p xmsg-persister -p xmsg-fanout -p xmsg-outbox -p xmsg-readstate -p xmsg-reaction-batcher -p xmsg-presence -p xmsg-search-indexer -p xmsg-push -p xmsg-e2e-smoke
          (cd services/sequencer && ./gradlew installDist --console=plain)
          (cd services/gateway && mix deps.get && MIX_ENV=prod mix compile)
      - name: Messages service integration tests (real Kafka + NATS)
        if: matrix.relay == 'poller'
        env:
          XMSG_IT_KAFKA: localhost:9092
          XMSG_IT_NATS: nats://localhost:4222
        run: cargo test -p xmsg-messages --test integration -- --ignored --test-threads=1
      - name: Persister integration tests (real Kafka + Cassandra 5)
        if: matrix.relay == 'poller'
        env:
          XMSG_IT_KAFKA: localhost:9092
          XMSG_IT_CQL: localhost:9042
        run: cargo test -p xmsg-persister --test integration -- --ignored --test-threads=1
      - name: Auth integration tests (real PostgreSQL)
        if: matrix.relay == 'poller'
        env:
          XMSG_IT_PG: postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg
        run: cargo test -p xmsg-auth --test integration -- --ignored
      - name: Gateway revocation replay test (real Kafka)
        if: matrix.relay == 'poller'
        working-directory: services/gateway
        env:
          XMSG_IT_KAFKA: localhost:9092
        run: mix test --only kafka
      - name: Outbox relay integration tests (real PostgreSQL + Kafka)
        if: matrix.relay == 'poller'
        env:
          XMSG_IT_PG: postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg
          XMSG_IT_KAFKA: localhost:9092
        run: cargo test -p xmsg-outbox --test integration -- --ignored --test-threads=1
      - name: Channels integration tests (real PostgreSQL)
        if: matrix.relay == 'poller'
        env:
          XMSG_IT_PG: postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg
        run: cargo test -p xmsg-channels --test integration -- --ignored
      - name: Users integration tests (real PostgreSQL)
        if: matrix.relay == 'poller'
        env:
          XMSG_IT_PG: postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg
        run: cargo test -p xmsg-users --test integration -- --ignored
      - name: Start auth, users, channels, sequencer, messages, persister, fan-out and gateway
        run: |
          mkdir -p logs
          XMSG_AUTH_KEY=$(openssl rand -base64 32) \
            XMSG_DATABASE_URL=postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg \
            ./target/release/xmsg-auth > logs/auth.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8081/healthz >/dev/null && break; sleep 1; done
          XMSG_DATABASE_URL=postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg \
            XMSG_AUTH_JWKS_URL=http://localhost:8081/.well-known/jwks.json \
            ./target/release/xmsg-users > logs/users.log 2>&1 &
          XMSG_DATABASE_URL=postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg \
            XMSG_AUTH_JWKS_URL=http://localhost:8081/.well-known/jwks.json \
            ./target/release/xmsg-channels > logs/channels.log 2>&1 &
          XMSG_DATABASE_URL=postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg \
            XMSG_OUTBOX_MODE=${{ matrix.relay == 'debezium' && 'cleanup' || 'relay' }} \
            ./target/release/xmsg-outbox-relay > logs/outbox-relay.log 2>&1 &
          ./target/release/xmsg-meta-relay > logs/meta-relay.log 2>&1 &
          XMSG_AUTH_JWKS_URL=http://localhost:8081/.well-known/jwks.json \
            ./target/release/xmsg-readstate > logs/readstate.log 2>&1 &
          XMSG_STATE_DIR=$RUNNER_TEMP/seq-state XMSG_INSTANCE_ID=ci-1 XMSG_ADVERTISED_HOST=localhost \
            services/sequencer/build/install/xmsg-sequencer/bin/xmsg-sequencer > logs/sequencer.log 2>&1 &
          XMSG_AUTH_JWKS_URL=http://localhost:8081/.well-known/jwks.json XMSG_SEARCH_URL=http://localhost:9200 \
            ./target/release/xmsg-messages > logs/messages.log 2>&1 &
          ./target/release/xmsg-persister > logs/persister.log 2>&1 &
          ./target/release/xmsg-reaction-batcher > logs/reaction-batcher.log 2>&1 &
          ./target/release/xmsg-presence > logs/presence.log 2>&1 &
          XMSG_OPENSEARCH_URL=http://localhost:9200 ./target/release/xmsg-search-indexer > logs/search-indexer.log 2>&1 &
          # A fresh VAPID key: the raw 32-byte P-256 private key, base64url (SEC1 DER bytes 8-39).
          openssl ecparam -genkey -name prime256v1 -noout -out "$RUNNER_TEMP/vapid.pem"
          VAPID=$(openssl ec -in "$RUNNER_TEMP/vapid.pem" -outform DER 2>/dev/null | tail -c +8 | head -c 32 | base64 | tr '/+' '_-' | tr -d '=\n')
          XMSG_PUSH_VAPID_PRIVATE_KEY=$VAPID XMSG_PUSH_ALLOW_HTTP=true XMSG_VALKEY_URL=redis://localhost:6379 \
            XMSG_DATABASE_URL=postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg \
            XMSG_AUTH_JWKS_URL=http://localhost:8081/.well-known/jwks.json \
            ./target/release/xmsg-push > logs/push.log 2>&1 &
          XMSG_SEQUENCER_URL=http://localhost:8090 ./target/release/xmsg-fanout > logs/fanout.log 2>&1 &
          (cd services/gateway && MIX_ENV=prod XMSG_GATEWAY_ID=ci \
            XMSG_AUTH_JWKS_URL=http://localhost:8081/.well-known/jwks.json \
            mix run --no-halt > ../../logs/gateway.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fs http://localhost:4000/healthz >/dev/null \
              && grep -q 'JWKS loaded' logs/gateway.log \
              && grep -q 'channels ready' logs/channels.log \
              && grep -q 'outbox relay ready' logs/outbox-relay.log \
              && grep -q 'meta-relay ready' logs/meta-relay.log \
              && grep -q 'readstate ready' logs/readstate.log \
              && grep -q 'users ready' logs/users.log \
              && grep -q 'messages service ready' logs/messages.log \
              && grep -q 'history reads ready' logs/messages.log \
              && grep -q 'persister ready' logs/persister.log \
              && grep -q 'reaction-batcher ready' logs/reaction-batcher.log \
              && grep -q 'presence ready' logs/presence.log \
              && grep -q 'search indexer ready' logs/search-indexer.log \
              && grep -q 'push ready' logs/push.log \
              && grep -q 'fanout ready' logs/fanout.log \
              && grep -q 'REBALANCING to RUNNING' logs/sequencer.log && exit 0
            sleep 2
          done
          echo "services did not become ready"; tail -n 50 logs/*.log; exit 1
      - name: End-to-end smoke (auth → users → channels → client → gateway → messages → sequencer → persister + fan-out → clients)
        env:
          XMSG_AUTH_URL: http://localhost:8081
          XMSG_CHANNELS_URL: http://localhost:8082
          XMSG_MESSAGES_URL: http://localhost:8083
          XMSG_READSTATE_URL: http://localhost:8085
          XMSG_SEQUENCER_URL: http://localhost:8090
          XMSG_PUSH_URL: http://localhost:8086
          XMSG_EXPECT_OUTBOX_RELAY: "true"
          XMSG_EXPECT_REVOCATION: "true"
          XMSG_EXPECT_WORKSPACE_REMOVAL: "true"
          XMSG_USERS_URL: http://localhost:8084
        run: ./target/release/xmsg-e2e-smoke
      - name: Save Debezium's log
        if: always() && matrix.relay == 'debezium'
        working-directory: deploy/compose
        run: mkdir -p ../../logs && docker compose --profile debezium logs debezium > ../../logs/debezium.log 2>&1 || true
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ matrix.relay }}
          path: logs/
          if-no-files-found: ignore
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  chaos:
    name: Chaos (Phase 1a/1b exit criteria)
    runs-on: ubuntu-latest
    needs: [rust, elixir, sequencer]
    timeout-minutes: 25
    env:
      XMSG_PARTITIONS: "16"
      XMSG_KAFKA_BOOTSTRAP: localhost:9092
      XMSG_NATS_URL: nats://localhost:4222
      XMSG_CQL_NODES: localhost:9042
      XMSG_DATABASE_URL: postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - uses: gradle/actions/setup-gradle@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Start Kafka, Cassandra and PostgreSQL (Small-tier compose)
        working-directory: deploy/compose
        run: |
          docker compose up -d --wait kafka cassandra postgres
          docker compose up kafka-init --exit-code-from kafka-init
          docker compose up cassandra-init --exit-code-from cassandra-init
      - name: Build
        run: |
          cargo build --release -p xmsg-auth -p xmsg-channels -p xmsg-messages -p xmsg-persister -p xmsg-fanout -p xmsg-chaos
          (cd services/sequencer && ./gradlew installDist --console=plain)
          (cd services/gateway && mix deps.get && MIX_ENV=prod mix compile)
      # The tool runs NATS itself so it can be killed too: same binary as the compose image.
      - name: Take nats-server from the compose image
        run: |
          id=$(docker create nats:2.10-alpine)
          docker cp "$id:/usr/local/bin/nats-server" "$RUNNER_TEMP/nats-server"
          docker rm "$id"
      # The tool starts the services itself so it can kill and restart them.
      - name: Chat under load while NATS, the sequencer, fan-out, persister and messages service are killed and restarted
        run: >-
          ./target/release/xmsg-chaos --duration 150 --users 12 --channels 4 --senders 6 --rate 4
          --nats-server "$RUNNER_TEMP/nats-server"
          --targets nats,sequencer-1,fanout,persister,nats,sequencer-2,messages
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs
          path: target/chaos/*.log
          if-no-files-found: ignore
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
