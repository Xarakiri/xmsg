# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Licences, boundaries, vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers and core/ee boundary
        run: tools/check-spdx.sh
      - name: Partition vectors match the generator
        run: |
          python3 -I tools/gen-partition-vectors.py /tmp/vectors.csv
          diff -u spec/partitioning/vectors.csv /tmp/vectors.csv

  proto:
    name: Protobuf (Buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          # Breaking-change checks against main start once main has a baseline.
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main,subdir=proto
          push: false
          # Results show in the job log and annotations; posting PR comments needs a write token.
          pr_comment: false

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (crates/xmsg-proto compiles proto/ with prost)
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  typescript:
    name: TypeScript client core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm test
        working-directory: clients/core

  elixir:
    name: Elixir gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Generated protobuf modules are up to date
        run: |
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          mix local.hex --force
          mix escript.install hex protobuf 0.17.1 --force
          tools/gen-elixir-proto.sh
          git diff --exit-code -- services/gateway/lib/xmsg_gateway/proto
      - run: mix deps.get
        working-directory: services/gateway
      - run: mix format --check-formatted
        working-directory: services/gateway
      - run: mix compile --warnings-as-errors
        working-directory: services/gateway
      - run: mix test
        working-directory: services/gateway

  sequencer:
    name: Kotlin sequencer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
        working-directory: services/sequencer

  sequencer-integration:
    name: Sequencer integration (real Kafka)
    runs-on: ubuntu-latest
    needs: sequencer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - uses: gradle/actions/setup-gradle@v4
      - name: Crash/fencing, restore and startup-check tests (Testcontainers)
        run: ./gradlew integrationTest -Dxmsg.crash.kills=12
        working-directory: services/sequencer
      - name: Upload sequencer logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequencer-integration-logs
          path: |
            services/sequencer/build/it-logs/
            services/sequencer/build/reports/tests/integrationTest/
          if-no-files-found: ignore

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: docker compose -f deploy/compose/docker-compose.yml config -q
      - name: Start core stack and wait for init jobs
        working-directory: deploy/compose
        run: |
          docker compose up -d --wait kafka cassandra postgres valkey nats
          docker compose up kafka-init --exit-code-from kafka-init
          docker compose up cassandra-init --exit-code-from cassandra-init
      - name: Check the Cassandra schema
        working-directory: deploy/compose
        run: |
          out=$(docker compose exec -T cassandra cqlsh -e "SELECT table_name FROM system_schema.tables WHERE keyspace_name = 'xmsg';")
          echo "$out"
          tables=$(echo "$out" | grep -oE '\(([0-9]+) rows\)' | grep -oE '[0-9]+')
          test "$tables" -eq "$(grep -c 'CREATE TABLE' init/cassandra/001_schema.cql)"
      - name: Show logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  pipeline:
    name: Pipeline (service integration + end-to-end smoke)
    runs-on: ubuntu-latest
    needs: [rust, elixir, sequencer]
    env:
      XMSG_PARTITIONS: "16"
      XMSG_KAFKA_BOOTSTRAP: localhost:9092
      XMSG_NATS_URL: nats://localhost:4222
      XMSG_CQL_NODES: localhost:9042
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - uses: gradle/actions/setup-gradle@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Start Kafka, NATS, Cassandra and PostgreSQL (Small-tier compose)
        working-directory: deploy/compose
        run: |
          docker compose up -d --wait kafka nats cassandra postgres
          docker compose up kafka-init --exit-code-from kafka-init
          docker compose up cassandra-init --exit-code-from cassandra-init
      - name: Build
        run: |
          cargo build --release -p xmsg-auth -p xmsg-messages -p xmsg-persister -p xmsg-fanout -p xmsg-e2e-smoke
          (cd services/sequencer && ./gradlew installDist --console=plain)
          (cd services/gateway && mix deps.get && MIX_ENV=prod mix compile)
      - name: Messages service integration tests (real Kafka + NATS)
        env:
          XMSG_IT_KAFKA: localhost:9092
          XMSG_IT_NATS: nats://localhost:4222
        run: cargo test -p xmsg-messages --test integration -- --ignored --test-threads=1
      - name: Persister integration tests (real Kafka + Cassandra 5)
        env:
          XMSG_IT_KAFKA: localhost:9092
          XMSG_IT_CQL: localhost:9042
        run: cargo test -p xmsg-persister --test integration -- --ignored --test-threads=1
      - name: Auth integration tests (real PostgreSQL)
        env:
          XMSG_IT_PG: postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg
        run: cargo test -p xmsg-auth --test integration -- --ignored
      - name: Start auth, sequencer, messages, persister, fan-out and gateway
        run: |
          mkdir -p logs
          XMSG_AUTH_KEY=$(openssl rand -base64 32) \
            XMSG_DATABASE_URL=postgres://xmsg:xmsg-dev-only@localhost:5432/xmsg \
            ./target/release/xmsg-auth > logs/auth.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8081/healthz >/dev/null && break; sleep 1; done
          XMSG_STATE_DIR=$RUNNER_TEMP/seq-state XMSG_INSTANCE_ID=ci-1 \
            services/sequencer/build/install/xmsg-sequencer/bin/xmsg-sequencer > logs/sequencer.log 2>&1 &
          ./target/release/xmsg-messages > logs/messages.log 2>&1 &
          ./target/release/xmsg-persister > logs/persister.log 2>&1 &
          ./target/release/xmsg-fanout > logs/fanout.log 2>&1 &
          (cd services/gateway && MIX_ENV=prod XMSG_GATEWAY_ID=ci \
            XMSG_AUTH_JWKS_URL=http://localhost:8081/.well-known/jwks.json \
            mix run --no-halt > ../../logs/gateway.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fs http://localhost:4000/healthz >/dev/null \
              && grep -q 'JWKS loaded' logs/gateway.log \
              && grep -q 'messages service ready' logs/messages.log \
              && grep -q 'persister ready' logs/persister.log \
              && grep -q 'fanout ready' logs/fanout.log \
              && grep -q 'REBALANCING to RUNNING' logs/sequencer.log && exit 0
            sleep 2
          done
          echo "services did not become ready"; tail -n 50 logs/*.log; exit 1
      - name: End-to-end smoke (auth → client → gateway → messages → sequencer → persister + fan-out → clients)
        env:
          XMSG_AUTH_URL: http://localhost:8081
        run: ./target/release/xmsg-e2e-smoke
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          if-no-files-found: ignore
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
