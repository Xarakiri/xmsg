# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-loadgen"
description = "WebSocket load generator for the xmsg gateway (Phase 0 capacity spike)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-nats = "0.46.0"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hdrhistogram = "7.5.4"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = "0.30.0"
xmsg-proto = { path = "../../crates/xmsg-proto" }
