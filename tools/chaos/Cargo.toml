# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-chaos"
description = "Phase 1a exit test: chat under load while the sequencer, fan-out, persister and messages service are killed and restarted"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
xmsg-proto = { path = "../../crates/xmsg-proto" }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.191"
rdkafka = { version = "0.39.0", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
scylla = "1.5.0"
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
tokio-tungstenite = "0.30.0"
