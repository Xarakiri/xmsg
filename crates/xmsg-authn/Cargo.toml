# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "xmsg-authn"
description = "Validates xmsg access tokens (EdDSA JWTs) against the auth service's JWKS"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
xmsg-auth = { path = "../../services/auth" }
axum = "0.8.9"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net"] }
